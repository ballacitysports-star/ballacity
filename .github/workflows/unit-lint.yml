name: Unit & Lint

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same ref supersedes the run it replaced.
concurrency:
  group: unit-lint-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no Supabase secrets here. Specs named *.integration.test.ts skip
# themselves when no backend credentials are present, so this workflow only runs
# the self-contained tests and can never read or write a real database. The
# integration specs are exercised by the E2E workflow, which owns the shared
# fixture project.
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Informational for now: `eslint .` reports thousands of existing problems
      # (mostly no-explicit-any and Prettier formatting) that predate this
      # workflow. The step still runs and its output is in the log, but it does
      # not fail the job. Once the backlog is cleaned up, delete the
      # continue-on-error line to make lint a blocking check.
      - name: Run lint
        run: bun run lint
        continue-on-error: true

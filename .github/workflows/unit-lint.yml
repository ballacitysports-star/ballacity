name: Unit & Lint

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only checks out, builds and tests. It never
# writes to the repository, so its token is read-only.
permissions:
  contents: read

# A new push to the same ref supersedes the run it replaced.
concurrency:
  group: unit-lint-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no Supabase secrets here. Specs named *.integration.test.ts skip
# themselves when no backend credentials are present, so this workflow only runs
# the self-contained tests and can never read or write a real database. The
# integration specs are exercised by the E2E workflow, which owns the shared
# fixture project.
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The formatting check below compares with the base branch.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Informational for now: `eslint .` reports thousands of existing problems
      # (mostly no-explicit-any and Prettier formatting) that predate this
      # workflow. The step still runs and its output is in the log, but it does
      # not fail the job. Once the backlog is cleaned up, delete the
      # continue-on-error line to make lint a blocking check.
      - name: Run lint
        run: bun run lint
        continue-on-error: true

      # Blocking, unlike the full lint above: a hook called after an early
      # return changes the hook count between renders and crashes the page.
      # The backlog for this rule is zero, so any new hit is a regression.
      - name: Lint (rules of hooks must pass)
        run: |
          if bunx eslint src --quiet | grep "react-hooks/rules-of-hooks"; then
            echo "A hook is called conditionally; see the lines above."
            exit 1
          fi

      # Blocking (P3-9 lint ratchet): no file this pull request touches may end with more
      # ESLint errors than it had at the branch point, and a new file must have none.
      # The full `eslint .` above stays informational until its backlog is gone.
      - name: Lint (files changed in this pull request add no errors)
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE: origin/${{ github.base_ref }}
        run: node scripts/lint-changed.mjs

      # Blocking, and only for what this pull request touches. 240 older files are
      # not Prettier-formatted, and reformatting them all at once would bury real
      # changes; so edited and new files must be clean and the backlog only shrinks.
      - name: Format (files changed in this pull request)
        if: github.event_name == 'pull_request'
        env:
          FORMAT_BASE: origin/${{ github.base_ref }}
        run: bun run format:check:changed

      # Blocking (plan 9.2 test gate): a migration in this pull request that adds or changes a
      # row-level security policy needs a SQL test under supabase/tests/ in the same pull request.
      - name: Policy changes come with a SQL test
        if: github.event_name == 'pull_request'
        env:
          POLICY_BASE: origin/${{ github.base_ref }}
        run: node scripts/policy-tests-gate.mjs

  # Two blocking checks that nothing else in CI makes: that the code type-checks, and
  # that the production bundle builds. Unit tests run through Vitest, which strips
  # types without checking them, and no other job builds the app, so a type error or a
  # broken import could reach `main` with every check green.
  #
  # One job, not two: both need the same install, so a second job would repeat it.
  # The build step still runs after a type error (`!cancelled()`), so a single run
  # reports both results instead of costing a second round trip.
  #
  # No secrets, and nothing here can reach a backend. `vite.config.ts` fills any unset
  # or EMPTY variable from `.env.production` (the real backend and a live Stripe
  # publishable key) and falls back to literals for the three Supabase browser
  # variables, so the build step sets every one of them to an inert placeholder. The
  # last step then fails the job if the production project reference is still found in
  # the output. The artifact is never uploaded or deployed.
  #
  # Its name, "Typecheck & build", is the status check to require on `main`; see
  # docs/ci-security.md.
  typecheck-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `noEmit` in tsconfig.json, so this only checks. The local binary, not `bunx`,
      # so nothing is fetched at run time.
      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      # The bundle outgrew Node's default heap on a runner (~2 GB): the build dies with
      # "JavaScript heap out of memory" before it finishes. 4096 is what the E2E build
      # uses; runners have 16 GB.
      - name: Build
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Every variable `.env.production` would seed, set to something else.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          SUPABASE_PROJECT_ID: ci-build-placeholder
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-build-placeholder
          # Not a pk_* key, so the build reads as payments-not-configured and never
          # loads Stripe.
          VITE_PAYMENTS_CLIENT_TOKEN: ci-build-payments-disabled
          # Otherwise falls back to the real GA4 measurement ID.
          GOOGLE_ANALYTICS_MEASUREMENT_ID: G-CIBUILD0000
        run: bun run build

      - name: Check the build carries no production backend
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d .output ]; then
            echo "No build output to inspect (the build step failed or did not run)."
            exit 1
          fi
          if grep -rIl "cpqihhcqeivbgxqbzatv" .output; then
            echo "The production project reference is in the build output; see the files above."
            exit 1
          fi

      # P3-4 bundle budget: entry and total client JS may not grow more than 5 percent
      # over build/bundle-baseline.json, no other chunk may pass 150 kB gzip and the total
      # may not pass 1.5 MB. The plan's 250 kB entry target is reported until it is met.
      - name: Bundle budget
        if: ${{ !cancelled() }}
        run: node scripts/bundle-budget.mjs .output/public/assets

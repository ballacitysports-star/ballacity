name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Force Playwright to use its own managed Chromium rather than the
      # sandbox-only path baked into playwright.config.ts.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ""
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build (dev mode)
        run: bun run build:dev

      - name: Start dev server
        run: |
          bun run dev > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:8080; then
              echo "Dev server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"
          cat dev-server.log
          exit 1

      - name: Run Playwright tests
        run: bunx playwright test

      - name: Stop dev server
        if: always()
        run: |
          if [ -f dev-server.pid ]; then
            kill "$(cat dev-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

name: E2E

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only checks out, builds and tests. It never
# writes to the repository, so its token is read-only.
permissions:
  contents: read

# Two levels, because they solve different problems.
#
# Workflow level, keyed on the ref: a new push to the same branch cancels the
# run it superseded. That is the usual "don't test stale code" saving.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    # This is the only job in the repository that receives the E2E_* secrets.
    #
    # `environment: e2e-sandbox` scopes them to a protected GitHub Environment, so a
    # pull request that edits this file to drop the line gets no environment secrets,
    # and one that keeps it waits for the Environment's required reviewers. The
    # Environment, its reviewers, its secrets and its E2E_SANDBOX_PROJECT_REF
    # variable are configured in GitHub settings, not here: see docs/ci-security.md.
    #
    # Approval is not the safety control. The first step below refuses to continue
    # unless the target is consistent, designated and not production, so an
    # unconfigured or mis-configured run stops before anything is built or started.
    # Without it, empty secrets would fall through vite.config.ts to the production
    # backend.
    environment: e2e-sandbox
    # Fail closed on who may run it. Only pushes to main and pull requests from
    # THIS repository by someone other than Dependabot qualify. Fork pull requests
    # never receive secrets anyway (this workflow uses pull_request, never
    # pull_request_target); the condition makes that explicit and also skips the job
    # so it does not fail noisily. A SKIPPED job is not a passing remote E2E test:
    # nothing was run.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]')
    # Job level, keyed on nothing: only one E2E job in the repository executes
    # at a time, whatever ref it is on.
    #
    # The ref-keyed group above cannot do this. A PR's run and main's run sit
    # in different groups, so they never serialise against each other — and
    # merging a PR fires both at once, seconds apart. Runs 58/59 started 5s
    # apart, 56/57 53s apart, and 68/69 overlapped for 23 minutes.
    #
    # They share one Supabase project and the same handful of fixture
    # accounts, so an overlap is two suites signing the same users in and out,
    # writing the same rows and cancelling each other's sessions. That is why
    # the suite has looked non-deterministic: run 68 failed 79 tests during a
    # 23-minute overlap, while run 70 — essentially alone — failed far fewer,
    # with the code between them differing by one CSS rule.
    #
    # cancel-in-progress is false here on purpose: a queued run must wait for
    # the database, not kill whoever holds it. GitHub keeps at most one run
    # pending per group and drops the older pending one, so this serialises
    # without building a backlog.
    concurrency:
      group: e2e-shared-supabase-fixtures
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Single-worker by design (see playwright.config.ts): many specs share the
    # same few fixture accounts and parallel runs would race on them.
    #
    # Raised 20 -> 40 once before, for a run that was believed to have the
    # fixture accounts signed in. It did not — seeding had never actually
    # succeeded, so ~168 specs auto-skipped for want of a session and the suite
    # finished in about seven minutes while looking healthy.
    #
    # Seeding works now, so those specs execute for the first time and the suite
    # takes far longer: run 91 reached spec 152 of 197 in 38 minutes before this
    # ceiling killed it, which also destroyed the JSON report and with it any
    # view of what actually failed. 75 leaves room to finish and still report.
    timeout-minutes: 75
    env:
      # Force Playwright to use its own managed Chromium rather than the
      # sandbox-only path baked into playwright.config.ts.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ""
      E2E_BASE_URL: http://localhost:8080
      # No Supabase value lives at job level. Each step below that needs one declares
      # exactly the ones it needs, and re-runs the preflight on those very values first,
      # so what is validated is what the process receives. See docs/ci-security.md.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # First, before install, build, dev server, browser or any fixture write.
      # Prints check names only, never a value. See .github/e2e-preflight.mjs.
      - name: Verify E2E target (fail closed)
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SANDBOX_PROJECT_REF: ${{ vars.E2E_SANDBOX_PROJECT_REF }}
        run: node .github/e2e-preflight.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Node's default old-space limit is sized from the machine's memory, and
      # on a GitHub runner that lands around 2 GB. The bundle outgrew it — every
      # E2E run since #50 died here with "Reached heap limit ... JavaScript heap
      # out of memory" and SIGABRT (exit 134), before a single test ran, on main
      # and on pull requests alike.
      #
      # Reproduced locally by capping the heap at the same 2 GB, which fails
      # identically, and confirmed fixed at 4096. Runners have 16 GB, so this is
      # comfortable rather than generous.
      # Browser-facing values only: no service role key reaches the build.
      # VITE_PAYMENTS_CLIENT_TOKEN is set on purpose: vite.config.ts fills any unset or empty
      # variable from .env.production, which holds a LIVE Stripe key. The placeholder is not
      # a pk_* key, so the build reads as payments-not-configured and never loads Stripe.
      - name: Build (dev mode)
        run: |
          node .github/e2e-preflight.mjs --runtime
          bun run build:dev
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID }}
          E2E_SANDBOX_PROJECT_REF: ${{ vars.E2E_SANDBOX_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID }}
          VITE_PAYMENTS_CLIENT_TOKEN: e2e-payments-disabled
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID }}

      # Playwright starts the dev server itself (playwright.config.ts `webServer`, built by
      # e2e/safety/dev-server.ts) from the verified environment, and refuses to adopt one
      # that is already running, so there is no separate start or stop step.
      #
      # This is the one step that holds the service role key, and that is a technical
      # requirement: the app's server functions build an admin client from it, global setup
      # seeds the fixture accounts with it, and the guard checks its claims. It reaches the
      # dev server through the launcher's inherited environment (never the serialized
      # config), and global setup removes it from the Playwright process after reading it.
      #
      # E2E_SUPABASE_SERVICE_ROLE_KEY exists only so the preflight can compare the two
      # copies. It is unset right after the preflight, before Playwright starts, so neither
      # name reaches a spec worker or its children. Do not move the unset before the
      # preflight.
      #
      # --trace=off: traces record network requests and DOM snapshots, and the fixture
      # user's session is injected into the page, so a trace would carry that user's
      # tokens into an artifact. Screenshots stay in the runner's workspace and are not
      # uploaded (see the upload step).
      #
      # Output, including the dev server's stderr that Playwright forwards, is streamed
      # through the redactor line by line. `shell: bash` adds `-o pipefail`, so the step
      # fails if Playwright fails or if the redactor fails; a redactor failure is never
      # swallowed and never prints the offending line.
      - name: Run Playwright tests
        shell: bash
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SANDBOX_PROJECT_REF: ${{ vars.E2E_SANDBOX_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID }}
          VITE_PAYMENTS_CLIENT_TOKEN: e2e-payments-disabled
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.E2E_SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node .github/e2e-preflight.mjs --service
          unset E2E_SUPABASE_SERVICE_ROLE_KEY
          bunx playwright test --trace=off 2>&1 | node .github/ci-redact.mjs --stream

      # The JSON report holds error messages. It is sanitized into a DIFFERENT file; the
      # raw report is never an upload candidate. The `sanitized` output is set only after
      # the redactor exited 0 (bash -e stops the step on failure), and the upload below is
      # gated on it, so a failure blocks the upload even if no file could be removed or
      # overwritten. Failure output is one fixed line, never content.
      - name: Redact report
        id: redact
        if: always()
        run: |
          rm -rf ci-sanitized
          if [ ! -f playwright-report/results.json ]; then
            echo "No report was produced; nothing to sanitize."
            exit 0
          fi
          mkdir ci-sanitized
          node .github/ci-redact.mjs --in playwright-report/results.json --out ci-sanitized/results.json
          echo "sanitized=true" >> "$GITHUB_OUTPUT"

      # Runs even when the suite fails, which is the only time it matters.
      # Reads the JSON reporter's file rather than the job log, so the tally
      # survives the stdout truncation that lost it in runs 70 and 71.
      - name: Summarise results
        if: always()
        run: |
          f=ci-sanitized/results.json
          if [ ! -f "$f" ]; then echo "no sanitized report available (none produced, or sanitizing failed)"; exit 0; fi
          node -e '
            const r = require("./ci-sanitized/results.json");
            const out = [];
            const walk = (s) => (s.suites ?? []).forEach(walk) ||
              (s.specs ?? []).forEach((sp) => sp.tests.forEach((t) =>
                out.push({ status: t.status, title: sp.title, file: sp.file,
                  err: (t.results ?? []).map((x) => x.error?.message).find(Boolean) ?? "" })));
            (r.suites ?? []).forEach(walk);
            const by = (st) => out.filter((o) => o.status === st).length;
            const failed = out.filter((o) => o.status !== "expected" && o.status !== "skipped");
            const line = `${failed.length} failed, ${by("expected")} passed, ${by("skipped")} skipped, ${out.length} total`;
            console.log(line);
            const files = [...new Set(failed.map((f) => f.file))].sort();
            console.log(`${files.length} spec files with failures:`);
            const clean = (e) => e.replace(/\u001b\[[0-9;]*m/g, "").split("\n")[0].slice(0, 160);
            for (const f of files) {
              console.log("  " + f);
              for (const t of failed.filter((x) => x.file === f))
                console.log(`      ${t.title}\n        ${clean(t.err) || "(no error message)"}`);
            }
            const sum = process.env.GITHUB_STEP_SUMMARY;
            if (sum) require("fs").appendFileSync(sum,
              `### E2E\n\n${line}\n\n` +
              files.map((f) => `- ${f}\n` + failed.filter((x) => x.file === f)
                .map((t) => `  - ${t.title} — \`${clean(t.err) || "no message"}\``).join("\n")).join("\n") + "\n");
          '

      - name: Upload Playwright report
        # Only after the redactor succeeded. `always()` keeps it running after test failures.
        if: always() && steps.redact.outputs.sanitized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Exactly the sanitized file. Neither the raw report nor test-results/ (screenshots,
          # per-test files) is a candidate: they can show or contain the fixture user's session.
          path: ci-sanitized/results.json
          retention-days: 3
          if-no-files-found: error

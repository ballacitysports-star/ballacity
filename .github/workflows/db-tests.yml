name: Database tests

# Replays every migration (supabase/migrations and drizzle/migrations together)
# into a throwaway Postgres and runs the SQL tests in supabase/tests; see
# scripts/db-test.mjs. No secrets, and no access to any real database: the
# Postgres below exists only for this job.

# No `paths:` filter, on purpose. A required status check that never runs (because no migration or test file
# changed) stays "Expected" forever and blocks the merge, so the job must report on every pull request and every push
# to main. It takes about a minute and a half, uses no secrets and reaches no real database. Failures still fail the job:
# scripts/db-test.mjs exits non-zero when a migration does not apply or an assertion fails.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only checks out, builds and tests. It never
# writes to the repository, so its token is read-only.
permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: Replay migrations and run SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Supabase runs Postgres 17.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make sure psql is available
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Replay migrations and run SQL tests
        run: node scripts/db-test.mjs
